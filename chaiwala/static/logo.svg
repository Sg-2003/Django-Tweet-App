<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Neon Blue/Cyan Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Modern Geometric Bird/T Icon -->
  <g filter="url(#neonGlow)">
    <!-- Main wing/bird shape -->
    <path d="M 30,42 C 42,34 58,34 68,44 C 54,42 42,48 38,58 C 48,54 58,56 64,62 C 50,62 42,68 38,76 C 54,70 66,62 70,48 C 72,40 70,30 62,24 C 52,16 36,22 30,42 Z" fill="url(#neonGrad)" />
  </g>
</svg>
