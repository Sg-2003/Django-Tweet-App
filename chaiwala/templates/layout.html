{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
        <title>
            {% block title %}
            Django - TweetApp
            {% endblock %}
        </title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/png" href="{% static 'logo.png' %}">
        
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="/admin/">
      <img src="{% static 'logo.png' %}" alt="TweetApp Logo" width="30" height="30" class="d-inline-block align-top me-2 rounded-circle">
      TweetApp
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/admin/">Admin</a>
        </li>
      </ul>
      <form class="d-flex" role="search" method="GET" action="{% url 'tweet_list' %}">
        <input class="form-control me-2" type="search" name="q" placeholder="Search tweets..." aria-label="Search" value="{{ request.GET.q }}"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
      <a class="btn btn-primary mx-2" href="{% url 'tweet_list' %}">Tweet Home</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger mx-2">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-primary mx-2" href="{% url 'register' %}">Register</a>
        <a class="btn btn-success mx-2" href="{% url 'login' %}">Login</a>
      {% endif %}
    </div>
  </div>
</nav>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
