{% extends "layout.html" %}

{% block title %}
TweetApp - Home
{% endblock %}

{% block content %}
<h1 class="text-center mt-4">Are You Sure, that you want to delete this Tweet?</h1>

<form method="post" class="form">
    {% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a class="btn btn-success" href="{% url 'tweet_list' %}">Cancel</a>
</form>
{% endblock %}
