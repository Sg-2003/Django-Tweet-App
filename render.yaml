databases:
  - name: tweetapp-db
    databaseName: tweetapp
    user: tweetapp

services:
  - type: web
    name: django-tweet-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn TweetApp.wsgi --chdir chaiwala"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tweetapp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.9
